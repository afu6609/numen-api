# Important Notes:
# Every field you add must be added to buildSrc/src/main/groovy/multiloader-common.gradle expandProps map.

# Project
version=0.0.9-SNAPSHOT
group=com.dwinovo.numen
java_version=17

# Common
minecraft_version=1.20.1
mod_name=Momo Engine
mod_author=dwinovo, afu6609
mod_id=momo_engine
artifact_base_name=momo-engine
license=LGPL-3.0-only
credits=Engine migrated from Dwinovo/minecraft-numen and numen-api under the GNU LGPL v3.0; the com.dwinovo.numen transition ABI is intentionally retained.
description=Compatibility engine for Momo. Provides the player/tool ABI and MCP bridge; momo_embodied owns lifecycle and physical execution in managed mode, while Numen-era data and configuration paths remain compatible.
minecraft_version_range=[1.20.1, 1.21)

# Fabric, see https://fabricmc.net/develop/ for new versions
fabric_version=0.92.1+1.20.1
fabric_loader_version=0.15.11

# Forge, see https://files.minecraftforge.net/ for new versions
forge_version=47.2.30
forge_version_range=[47,)
forge_loader_version_range=[47,)

# LLM transport uses java.net.http.HttpClient (JDK built-in, Java 11+) and
# Gson (already on the MC classpath). No third-party HTTP / SDK dependencies.

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

# numen-api publishes to the sibling ../numen-maven checkout by default.
# Override when needed with -Plocal_maven_url=file:///absolute/path/to/repo.
